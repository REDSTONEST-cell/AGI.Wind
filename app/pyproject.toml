[project]
name = "agi-wind"
version = "0.1.0"
description = "Portable authoritative companion archive and gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "alembic==1.17.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "Pillow==12.0.0",
  "websockets==15.0.1",
  "usearch==2.26.6",
]
[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "jsonschema==4.25.1"]
[project.scripts]
agi-wind = "agi_wind.cli:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires explicitly configured remote provider", "gpu: requires target GPU"]
[tool.hatch.build.targets.wheel]
packages = ["src/agi_wind"]
