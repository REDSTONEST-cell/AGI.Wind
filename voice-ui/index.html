<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breeze-TTS-2 中文界面</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>BREEZE-TTS-2.CPP</h1>
  <p>开放权重的中英双语语音合成，运行在 ggml 上。支持音色设计、音色克隆、风格控制和音色转换。</p>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="design">音色设计</button>
  <button class="tab" data-tab="clone">音色克隆</button>
  <button class="tab" data-tab="direction">音色风格控制</button>
  <button class="tab" data-tab="changer">音色转换</button>
  <button class="tab" data-tab="library">音色库</button>
</nav>

<main>
  <section class="panel active" id="design">
    <label>要朗读的文本
      <textarea data-f="text" rows="3" placeholder="欢迎来到今天的对话，我们的故事从这里开始。"></textarea>
    </label>
    <label>音色描述
      <textarea data-f="instruction" rows="2" placeholder="一位温柔、有思想的年轻女性，声音清澈，语气平静。"></textarea>
    </label>
    <div class="row">
      <label>引导强度 / CFG <input data-f="cfg" type="number" value="1" min="1" max="10" step="0.5" /></label>
      <label>随机种子 <input data-f="seed" type="number" value="42" /></label>
    </div>
    <button class="go">生成</button>
  </section>

  <section class="panel" id="clone">
    <label>要朗读的文本
      <textarea data-f="text" rows="3" placeholder="隔了这么久，再听到你的声音真好。"></textarea>
    </label>
    <label>已保存音色
      <select data-f="voice_id"><option value="">改为上传参考音频</option></select>
    </label>
    <p class="voice-desc"></p>
    <div class="refblock">
      <label>参考音频（WAV）
        <input data-f="ref_audio" type="file" accept="audio/*" />
      </label>
      <label>参考音频逐字文本（必须完全一致）
        <textarea data-f="ref_text" rows="2" placeholder="填写参考音频里一字不差的内容，标点也要一致。"></textarea>
      </label>
      <label>描述（可选，随音色保存）
        <textarea data-f="save_desc" rows="2" placeholder="例如：鱼丸的音色，温柔、自然，适合日常聊天。"></textarea>
      </label>
      <div class="row saverow">
        <label>保存为 <input data-f="save_name" type="text" placeholder="yuwan" /></label>
        <button class="save-voice">保存音色</button>
      </div>
    </div>
    <div class="row">
      <label>随机种子 <input data-f="seed" type="number" value="42" /></label>
    </div>
    <button class="go">生成</button>
  </section>

  <section class="panel" id="direction">
    <label>要朗读的文本
      <textarea data-f="text" rows="3" placeholder="我们需要谈谈昨晚发生的事。"></textarea>
    </label>
    <label>风格指令
      <textarea data-f="instruction" rows="2" placeholder="放慢语速，用克制、严肃的语气说话。"></textarea>
    </label>
    <label>已保存音色
      <select data-f="voice_id"><option value="">改为上传参考音频</option></select>
    </label>
    <p class="voice-desc"></p>
    <div class="refblock">
      <label>参考音频（WAV）
        <input data-f="ref_audio" type="file" accept="audio/*" />
      </label>
      <label>参考音频逐字文本（必须完全一致）
        <textarea data-f="ref_text" rows="2" placeholder="填写参考音频里一字不差的内容，标点也要一致。"></textarea>
      </label>
      <label>描述（可选，随音色保存）
        <textarea data-f="save_desc" rows="2" placeholder="例如：低沉年长的旁白声，缓慢、温暖，适合有声书。"></textarea>
      </label>
      <div class="row saverow">
        <label>保存为 <input data-f="save_name" type="text" placeholder="yuwan" /></label>
        <button class="save-voice">保存音色</button>
      </div>
    </div>
    <div class="row">
      <label>引导强度 / CFG <input data-f="cfg" type="number" value="1" min="1" max="10" step="0.5" /></label>
      <label>随机种子 <input data-f="seed" type="number" value="42" /></label>
    </div>
    <button class="go">生成</button>
  </section>

  <section class="panel" id="changer">
    <p class="note">把一段已有录音换成另一个人的音色，保留原来的内容和节奏，不需要输入文本。音高通常来自目标音色；如果源音频是歌声或语调很强，请提高“保留旋律”。</p>
    <label>源音频（WAV）
      <input data-f="source" type="file" accept="audio/*" />
    </label>
    <label>已保存音色
      <select data-f="voice_id"><option value="">改为上传参考音频</option></select>
    </label>
    <p class="voice-desc"></p>
    <div class="refblock">
      <label>目标音色（WAV）
        <input data-f="ref_audio" type="file" accept="audio/*" />
      </label>
      <label>目标音色逐字文本（必须完全一致）
        <textarea data-f="ref_text" rows="2" placeholder="填写目标音色参考音频里一字不差的内容。"></textarea>
      </label>
      <label>描述（可选，随音色保存）
        <textarea data-f="save_desc" rows="2" placeholder="例如：低沉年长的旁白声，缓慢、温暖，适合有声书。"></textarea>
      </label>
      <div class="row saverow">
        <label>保存为 <input data-f="save_name" type="text" placeholder="yuwan" /></label>
        <button class="save-voice">保存音色</button>
      </div>
    </div>
    <label>源音频文本（可选，有助于咬字更准）
      <textarea data-f="text" rows="2" placeholder="有源音频的准确文字时再填，没有就留空。"></textarea>
    </label>
    <div class="row">
      <label>保留旋律 <input data-f="keep_acoustic" type="number" value="0" min="0" max="6" step="1" /></label>
      <label>随机种子 <input data-f="seed" type="number" value="42" /></label>
    </div>
    <button class="go">开始转换</button>
  </section>

  <section class="panel" id="library">
    <div class="row libbar">
      <label>筛选 <input id="libfilter" type="text" placeholder="名称、描述、文本或字段" /></label>
      <button id="librefresh" class="ghost">刷新</button>
    </div>
    <p class="note" id="libcount"></p>
    <div id="liblist"></div>
  </section>

  <section class="output">
    <div class="row">
      <label class="toggle"><input id="stream" type="checkbox" checked /> 生成时边生成边播放</label>
      <label class="slider">缓冲 <output id="bufval">1.25秒</output>
        <input id="buffer" type="range" min="0" max="4" step="0.25" value="1.25" />
      </label>
    </div>
    <div class="status" id="status">空闲</div>
    <button id="stop" class="stop">停止</button>
    <audio id="player" controls></audio>
    <a id="download" class="dl" download="breeze.wav">下载 WAV</a>
  </section>
</main>

<footer>语气事件可以直接写在文本里：英文用圆括号，例如 (laugh)（笑）、(sigh)（叹气）、(gasp)（吸气）、(yawn)（打哈欠）、(whispers)（耳语）；中文用方括号，例如 [笑]、[叹气]。标签是纯文本，其他写法通常也能识别；如果模型把标签本身读了出来，换一个随机种子重新生成。</footer>
<script src="/app.js"></script>
</body>
</html>
